spring:
  application:
    name: digital-health-training

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/digital_health}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate must never alter it.
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      timeout: 2s

app:
  cognito:
    # The JwtDecoder is built in code rather than via
    # spring.security.oauth2.resourceserver.jwt.issuer-uri, because that property performs OIDC
    # discovery eagerly at startup and would make the application unbootable whenever Cognito is
    # unreachable — including in tests and local development.
    issuer-uri: ${COGNITO_ISSUER_URI:}
    user-pool-id: ${COGNITO_USER_POOL_ID:}
    client-id: ${COGNITO_CLIENT_ID:}
    region: ${AWS_REGION:ap-southeast-2}
  auth:
    # Must match the Cognito app client's access token lifetime. Determines how long a denylist
    # entry has to outlive a revoked token.
    access-token-ttl: 15m
    principal-cache-ttl: 5m
  invitations:
    ttl: 7d
    max-per-hour-per-org: 50
  mail:
    from: ${MAIL_FROM:no-reply@example.invalid}
    enabled: ${MAIL_ENABLED:false}
  web:
    base-url: ${WEB_BASE_URL:http://localhost:4200}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    io.simplicity.training: ${LOG_LEVEL:INFO}
