spring:
  application:
    name: digital-health-training

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/digital_health}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate must never alter it.
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      timeout: 2s

app:
  aws:
    # Set only for local runs, to reach the Floci emulator instead of AWS. Deployed environments
    # leave this empty so the SDK resolves real endpoints.
    endpoint-override: ${AWS_ENDPOINT_URL:}
  cognito:
    # The JwtDecoder is built in code rather than via
    # spring.security.oauth2.resourceserver.jwt.issuer-uri, because that property performs OIDC
    # discovery eagerly at startup and would make the application unbootable whenever Cognito is
    # unreachable — including in tests and local development.
    issuer-uri: ${COGNITO_ISSUER_URI:}
    user-pool-id: ${COGNITO_USER_POOL_ID:}
    client-ids: ${COGNITO_CLIENT_IDS:}
    region: ${AWS_REGION:ap-southeast-2}
  auth:
    # Must match the Cognito app client's access token lifetime. Determines how long a denylist
    # entry has to outlive a revoked token.
    access-token-ttl: 15m
    principal-cache-ttl: 5m
  invitations:
    ttl: 7d
    max-per-hour-per-org: 50
  mail:
    from: ${MAIL_FROM:no-reply@example.invalid}
    enabled: ${MAIL_ENABLED:false}
    # Set by the app stack. Empty locally, where there is no SES to report anything.
    configuration-set: ${MAIL_CONFIGURATION_SET:}
  media:
    # Empty until the media stack is deployed, in which case video is unavailable and nothing else
    # is affected.
    upload-bucket: ${MEDIA_UPLOAD_BUCKET:}
    asset-bucket: ${MEDIA_ASSET_BUCKET:}
    transcode-queue-arn: ${MEDIA_TRANSCODE_QUEUE_ARN:}
    transcode-role-arn: ${MEDIA_TRANSCODE_ROLE_ARN:}
    # Long enough to start watching, short enough that a forwarded link is not much use.
    playback-url-ttl: 15m
    max-upload-bytes: 524288000
  web:
    base-url: ${WEB_BASE_URL:http://localhost:4200}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

springdoc:
  # Without this every response is documented as */*, and the generated clients then treat each one
  # as an opaque blob rather than parsing it: openapi-generator only selects a JSON response type
  # for a media type it recognises as JSON, and */* is not one. Spring already returns
  # application/json at runtime; this makes the document say so.
  default-produces-media-type: application/json
  default-consumes-media-type: application/json
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  # The document is committed and diffed against the code, so it has to serialise identically on
  # every machine. Without these two, map ordering follows reflection order and the drift check
  # fails for reasons that have nothing to do with the API.
  writer-with-order-by-keys: true
  writer-with-default-pretty-printer: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    io.simplicity.training: ${LOG_LEVEL:INFO}
