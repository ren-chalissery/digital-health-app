<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sign in</title>
    <link rel="stylesheet" href="shared.css" />
  </head>
  <body>
    <div class="auth">
      <p class="auth__brand">Simplicity training</p>
      <div class="auth__card">
        <h1>Sign in</h1>
        <p class="auth__lede">Continue your training and review your reflections.</p>
        <div class="stack">
          <div class="field">
            <label for="email">Email address</label>
            <input id="email" type="email" value="alex@clinic.example.org" readonly />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" type="password" value="password" readonly />
          </div>
          <button class="button" type="button">Sign in</button>
        </div>
      </div>
    </div>
  </body>
</html>
