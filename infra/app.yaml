AWSTemplateFormatVersion: '2010-09-09'
Description: >
  ECR repository, ECS Fargate service, and Application Load Balancer for the Digital Health API.

Parameters:
  EnvironmentName:
    Type: String
    Default: prod
    AllowedValues: [prod, staging, dev]

  NetworkStackName:
    Type: String

  DataStackName:
    Type: String

  AuthStackName:
    Type: String

  ApiDomainName:
    Type: String
    Description: Fully qualified name for the API, for example api.example.org.

  HostedZoneId:
    Type: String
    Default: ''
    Description: >
      Route 53 zone for ApiDomainName. Required unless CertificateArn is supplied: without it the
      certificate cannot be validated automatically and the stack will hang waiting.

  CertificateArn:
    Type: String
    Default: ''
    Description: Existing ACM certificate for ApiDomainName. Leave empty to have one issued here.

  WebBaseUrl:
    Type: String
    Description: Origin of the web client. Used for CORS and for links in invitation emails.

  MailFrom:
    Type: String
    Description: Verified SES sender address for invitation emails.

  MailConfigurationSet:
    Type: String
    Default: ''
    Description: >
      SES configuration set from the mail stack. Invitations must send through it so bounces are
      tracked; leave empty only in local development.

  AlarmTopicArn:
    Type: String
    Description: >
      SNS topic from the mail stack. Infrastructure alarms publish here alongside mail reputation
      alarms, so the mail stack survives pausing this one.

  MediaStackName:
    Type: String
    Default: ''
    Description: >
      Name of the deployed media stack. Left empty before that stack exists, in which case video is
      simply unavailable and the rest of the application is unaffected.

  ImageTag:
    Type: String
    Default: latest
    Description: Image tag to run. The pipeline passes the commit sha so a rollback is a redeploy.

  DesiredCount:
    Type: Number
    Default: 1
    # Zero is legitimate, and required once: this stack creates the ECR repository, so on the very
    # first deploy there is no image for a task to run and the service can only settle at nothing.
    MinValue: 0

  TaskCpu:
    Type: String
    Default: '512'
    AllowedValues: ['256', '512', '1024', '2048']

  TaskMemory:
    Type: String
    Default: '1024'

  LogRetentionDays:
    Type: Number
    Default: 30

Conditions:
  IssueCertificate: !Equals [!Ref CertificateArn, '']
  HasMedia: !Not [!Equals [!Ref MediaStackName, '']]
  CreateDnsRecord: !Not [!Equals [!Ref HostedZoneId, '']]

Resources:
  Repository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub 'digital-health-${EnvironmentName}'
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: IMMUTABLE
      LifecyclePolicy:
        # Every commit to main pushes an image; without this the repository grows without bound.
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep the 20 most recent images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 20
                },
                "action": { "type": "expire" }
              }
            ]
          }

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Condition: IssueCertificate
    Properties:
      DomainName: !Ref ApiDomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref ApiDomainName
          HostedZoneId: !Ref HostedZoneId

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/digital-health-${EnvironmentName}'
      RetentionInDays: !Ref LogRetentionDays

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub 'digital-health-${EnvironmentName}'
      ClusterSettings:
        - Name: containerInsights
          Value: disabled

  # Pulls the image and writes logs. It also reads the database secret, because ECS resolves task
  # secrets before the container starts.
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-database-secret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:digital-health/${EnvironmentName}/database*'

  # What the application itself may do. Sending invitation email is the whole of it.
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: send-invitation-email
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ses:SendEmail
                Resource: '*'
                Condition:
                  StringEquals:
                    ses:FromAddress: !Ref MailFrom
        - PolicyName: assistant
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Scoped to the two models actually used, so a mistake in code cannot reach a model
              # nobody chose. Claude needs an inference profile rather than a bare model id, and
              # the au. profile is the one that keeps content in Australia — which is also why the
              # underlying model is granted in both Australian regions and nowhere else.
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource:
                  - !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0'
                  - !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/au.anthropic.claude-haiku-4-5-20251001-v1:0'
                  - 'arn:aws:bedrock:ap-southeast-2::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0'
                  - 'arn:aws:bedrock:ap-southeast-4::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0'
        - !If
          - HasMedia
          - PolicyName: media
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                # Presigning does not call S3, but reading an object to serve it and writing the
                # upload target both do.
                - Effect: Allow
                  Action:
                    - s3:GetObject
                    - s3:PutObject
                    - s3:DeleteObject
                  Resource:
                    - !Sub
                      - 'arn:aws:s3:::${Bucket}/*'
                      - Bucket: !ImportValue
                          Fn::Sub: '${MediaStackName}-UploadBucketName'
                    - !Sub
                      - 'arn:aws:s3:::${Bucket}/*'
                      - Bucket: !ImportValue
                          Fn::Sub: '${MediaStackName}-AssetBucketName'
                - Effect: Allow
                  Action:
                    - mediaconvert:CreateJob
                    - mediaconvert:GetJob
                    - mediaconvert:DescribeEndpoints
                  Resource: '*'
                # Scoped to the one role MediaConvert assumes. Unscoped PassRole would let this
                # task hand MediaConvert any role in the account.
                - Effect: Allow
                  Action: iam:PassRole
                  Resource: !ImportValue
                    Fn::Sub: '${MediaStackName}-TranscodeRoleArn'
          - !Ref AWS::NoValue

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub 'digital-health-${EnvironmentName}'
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      RuntimePlatform:
        # Graviton, for about 20 per cent less than x86. Nothing is emulated to get there: the
        # pipeline builds on an arm64 runner and developers build natively on Apple Silicon, so the
        # architecture running in production is the one the image was actually exercised on.
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: api
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${Repository}:${ImageTag}'
          Essential: true
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          Environment:
            - Name: DB_URL
              Value: !Sub
                - 'jdbc:postgresql://${Host}:${Port}/${Name}'
                - Host: !ImportValue
                    Fn::Sub: '${DataStackName}-DatabaseEndpoint'
                  Port: !ImportValue
                    Fn::Sub: '${DataStackName}-DatabasePort'
                  Name: !ImportValue
                    Fn::Sub: '${DataStackName}-DatabaseName'
            - Name: REDIS_HOST
              Value:
                Fn::ImportValue: !Sub '${DataStackName}-CacheEndpoint'
            - Name: REDIS_PORT
              Value:
                Fn::ImportValue: !Sub '${DataStackName}-CachePort'
            - Name: REDIS_SSL_ENABLED
              Value: 'false'
            - Name: COGNITO_ISSUER_URI
              Value:
                Fn::ImportValue: !Sub '${AuthStackName}-IssuerUri'
            - Name: COGNITO_USER_POOL_ID
              Value:
                Fn::ImportValue: !Sub '${AuthStackName}-UserPoolId'
            # Every client the pool issues access tokens to. A single value here would reject
            # every request from the other two the moment they were validated.
            - Name: COGNITO_CLIENT_IDS
              Value: !Join
                - ','
                - - Fn::ImportValue: !Sub '${AuthStackName}-WebClientId'
                  - Fn::ImportValue: !Sub '${AuthStackName}-IosClientId'
                  - Fn::ImportValue: !Sub '${AuthStackName}-AndroidClientId'
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: WEB_BASE_URL
              Value: !Ref WebBaseUrl
            - Name: CORS_ALLOWED_ORIGINS
              Value: !Ref WebBaseUrl
            - Name: MAIL_ENABLED
              Value: 'true'
            - Name: MAIL_FROM
              Value: !Ref MailFrom
            # Without this the application sends outside the configuration set, and the bounce and
            # complaint destination below never sees a thing.
            - Name: MAIL_CONFIGURATION_SET
              Value: !Ref MailConfigurationSet
            - Name: MEDIA_UPLOAD_BUCKET
              Value: !If
                - HasMedia
                - !ImportValue
                  Fn::Sub: '${MediaStackName}-UploadBucketName'
                - ''
            - Name: MEDIA_ASSET_BUCKET
              Value: !If
                - HasMedia
                - !ImportValue
                  Fn::Sub: '${MediaStackName}-AssetBucketName'
                - ''
            - Name: MEDIA_TRANSCODE_QUEUE_ARN
              Value: !If
                - HasMedia
                - !ImportValue
                  Fn::Sub: '${MediaStackName}-TranscodeQueueArn'
                - ''
            - Name: MEDIA_TRANSCODE_ROLE_ARN
              Value: !If
                - HasMedia
                - !ImportValue
                  Fn::Sub: '${MediaStackName}-TranscodeRoleArn'
                - ''
          Secrets:
            - Name: DB_USERNAME
              ValueFrom: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:digital-health/${EnvironmentName}/database:username::'
            - Name: DB_PASSWORD
              ValueFrom: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:digital-health/${EnvironmentName}/database:password::'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: api

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub 'digital-health-${EnvironmentName}'
      Type: application
      Scheme: internet-facing
      SecurityGroups:
        - Fn::ImportValue: !Sub '${NetworkStackName}-AlbSecurityGroupId'
      Subnets: !Split
        - ','
        - Fn::ImportValue: !Sub '${NetworkStackName}-PublicSubnetIds'
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: '60'
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: 'true'

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub 'digital-health-${EnvironmentName}'
      VpcId:
        Fn::ImportValue: !Sub '${NetworkStackName}-VpcId'
      Port: 8080
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /actuator/health/readiness
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200'
      TargetGroupAttributes:
        # Flyway runs at start-up, so a cold task needs longer than the default before the load
        # balancer gives up on it.
        - Key: deregistration_delay.timeout_seconds
          Value: '30'

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !If [IssueCertificate, !Ref Certificate, !Ref CertificateArn]
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  HttpRedirectListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: '443'
            StatusCode: HTTP_301

  Service:
    Type: AWS::ECS::Service
    DependsOn: HttpsListener
    Properties:
      ServiceName: !Sub 'digital-health-${EnvironmentName}'
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      # A cold JVM plus Flyway takes a while; without this grace period the first health check
      # fails and ECS kills the task it is still waiting for.
      HealthCheckGracePeriodSeconds: 120
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          # Public subnets with no NAT Gateway, so the task needs a public address to pull its
          # image and reach Cognito and SES. The security group is what keeps it unreachable.
          AssignPublicIp: ENABLED
          SecurityGroups:
            - Fn::ImportValue: !Sub '${NetworkStackName}-AppSecurityGroupId'
          Subnets: !Split
            - ','
            - Fn::ImportValue: !Sub '${NetworkStackName}-PublicSubnetIds'
      LoadBalancers:
        - ContainerName: api
          ContainerPort: 8080
          TargetGroupArn: !Ref TargetGroup

  DnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: CreateDnsRecord
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref ApiDomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt LoadBalancer.DNSName
        HostedZoneId: !GetAtt LoadBalancer.CanonicalHostedZoneID

  # --- Alarms -------------------------------------------------------------------------------
  #
  # Until these existed, the first anybody knew about an outage was a clinician saying so: the
  # account had no alarms and no topics at all.
  #
  # Each description says what a person would notice rather than which metric moved, because the
  # description is what arrives in the email at an inconvenient hour.

  ApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'digital-health-${EnvironmentName}-api-errors'
      AlarmDescription: >
        The API is returning server errors. People are seeing failures they cannot work around.
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt LoadBalancer.LoadBalancerFullName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopicArn]
      OKActions: [!Ref AlarmTopicArn]

  ApiUnavailableAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'digital-health-${EnvironmentName}-api-unavailable'
      AlarmDescription: >
        No healthy task is behind the load balancer. The API is down, not merely slow.
      Namespace: AWS/ApplicationELB
      MetricName: HealthyHostCount
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt LoadBalancer.LoadBalancerFullName
        - Name: TargetGroup
          Value: !GetAtt TargetGroup.TargetGroupFullName
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 5
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      # The one alarm where absent data is itself the alarm: nothing reporting means nothing running.
      TreatMissingData: breaching
      AlarmActions: [!Ref AlarmTopicArn]
      OKActions: [!Ref AlarmTopicArn]

  ApiDegradedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'digital-health-${EnvironmentName}-api-degraded'
      AlarmDescription: >
        A task is failing its health check. Deployments do this briefly; ten minutes of it does not.
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt LoadBalancer.LoadBalancerFullName
        - Name: TargetGroup
          Value: !GetAtt TargetGroup.TargetGroupFullName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 10
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopicArn]

  DatabaseStorageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'digital-health-${EnvironmentName}-database-storage'
      AlarmDescription: >
        The database is nearly full. Storage autoscales to 100GB, so reaching this means autoscaling
        has stopped working — and when it fills, every write fails, including reflections.
      Namespace: AWS/RDS
      MetricName: FreeStorageSpace
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Sub 'digital-health-${EnvironmentName}'
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 2147483648
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopicArn]

  DatabaseCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'digital-health-${EnvironmentName}-database-cpu'
      AlarmDescription: >
        The database has been busy for fifteen minutes. Pages are slow now and will start timing out.
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Sub 'digital-health-${EnvironmentName}'
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopicArn]

  CacheMemoryAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'digital-health-${EnvironmentName}-cache-memory'
      AlarmDescription: >
        The cache is nearly full and will start evicting. Evicted denylist entries mean a revoked
        session works again, which is the one thing this cache must not lose.
      Namespace: AWS/ElastiCache
      MetricName: DatabaseMemoryUsagePercentage
      Dimensions:
        # The node, not the replication group: '-001' is the id CloudWatch actually publishes under.
        - Name: CacheClusterId
          Value: !Sub 'digital-health-${EnvironmentName}-001'
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopicArn]

Outputs:
  RepositoryUri:
    Value: !GetAtt Repository.RepositoryUri
    Export:
      Name: !Sub '${AWS::StackName}-RepositoryUri'

  ClusterName:
    Value: !Ref Cluster
    Export:
      Name: !Sub '${AWS::StackName}-ClusterName'

  ServiceName:
    Value: !GetAtt Service.Name
    Export:
      Name: !Sub '${AWS::StackName}-ServiceName'

  LoadBalancerDnsName:
    Value: !GetAtt LoadBalancer.DNSName

  ApiBaseUrl:
    Description: Value for the web client's apiBaseUrl.
    Value: !Sub 'https://${ApiDomainName}'
    Export:
      Name: !Sub '${AWS::StackName}-ApiBaseUrl'
