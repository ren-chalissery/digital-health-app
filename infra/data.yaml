AWSTemplateFormatVersion: '2010-09-09'
Description: >
  PostgreSQL and Valkey for the Digital Health App. The master password is a fixed value stored in
  Secrets Manager (not rotated by RDS), so a snapshot restore can reuse the same secret without a
  password-sync step.

Parameters:
  EnvironmentName:
    Type: String
    Default: prod
    AllowedValues: [prod, staging, dev]

  NetworkStackName:
    Type: String
    Description: Name of the deployed network stack, whose exports this stack imports.

  DatabaseName:
    Type: String
    Default: digital_health

  DatabaseUsername:
    Type: String
    Default: dhapp
    Description: Master user. Its password lives in Secrets Manager, not in this template.

  DatabaseMasterPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: >
      Master password written into Secrets Manager on first deploy. Pass it once via
      DB_MASTER_PASSWORD when running bootstrap.sh; later deploys omit it and CloudFormation keeps
      the previous value. Never commit this.

  DatabaseInstanceClass:
    Type: String
    Default: db.t4g.micro

  DatabaseAllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20

  CacheNodeType:
    Type: String
    Default: cache.t4g.micro

  BackupRetentionDays:
    Type: Number
    Default: 7
    MinValue: 1

Resources:
  DatabaseCredentialsSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'digital-health/${EnvironmentName}/database'
      Description: >
        Fixed RDS master credentials. The app stack reads this by name, not by export, so the
        secret can be recreated without touching the app stack.
      SecretString: !Sub
        - '{"username":"${Username}","password":"${Password}"}'
        - Username: !Ref DatabaseUsername
          Password: !Ref DatabaseMasterPassword

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub 'digital-health-${EnvironmentName}'
      SubnetIds: !Split
        - ','
        - Fn::ImportValue: !Sub '${NetworkStackName}-PublicSubnetIds'

  Database:
    Type: AWS::RDS::DBInstance
    # Losing this instance means losing every clinician's reflections and the audit trail.
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub 'digital-health-${EnvironmentName}'
      Engine: postgres
      EngineVersion: '17.7'
      DBInstanceClass: !Ref DatabaseInstanceClass
      AllocatedStorage: !Ref DatabaseAllocatedStorage
      MaxAllocatedStorage: 100
      StorageType: gp3
      StorageEncrypted: true
      DBName: !Ref DatabaseName
      MasterUsername: !Ref DatabaseUsername
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DatabaseCredentialsSecret}:SecretString:password}}'
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups:
        - Fn::ImportValue: !Sub '${NetworkStackName}-DataSecurityGroupId'
      # In a public subnet but not publicly addressable: the security group is the boundary.
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: !Ref BackupRetentionDays
      PreferredBackupWindow: '16:00-17:00'
      PreferredMaintenanceWindow: 'sun:17:30-sun:18:30'
      DeletionProtection: true
      EnablePerformanceInsights: false
      AutoMinorVersionUpgrade: true
      CopyTagsToSnapshot: true
      Tags:
        - Key: Application
          Value: digital-health-app
        - Key: Environment
          Value: !Ref EnvironmentName

  CacheSubnetGroup:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      CacheSubnetGroupName: !Sub 'digital-health-${EnvironmentName}'
      Description: !Sub 'digital-health-${EnvironmentName}'
      SubnetIds: !Split
        - ','
        - Fn::ImportValue: !Sub '${NetworkStackName}-PublicSubnetIds'

  # Everything here is a cache or a short-lived index: principals, the revocation denylist,
  # invitation tokens, rate-limit counters. Losing the node costs a slower first request and a
  # brief window where a revoked token still works, not data, so a single node with no replica
  # and no snapshots is the right trade at this size.
  #
  # A replication group rather than a cache cluster, despite there being nothing to replicate:
  # ElastiCache's CreateCacheCluster API rejects Valkey outright, and CreateReplicationGroup is the
  # only way to ask for that engine.
  Cache:
    Type: AWS::ElastiCache::ReplicationGroup
    Properties:
      ReplicationGroupId: !Sub 'digital-health-${EnvironmentName}'
      ReplicationGroupDescription: !Sub 'digital-health-${EnvironmentName}'
      Engine: valkey
      EngineVersion: '8.0'
      CacheNodeType: !Ref CacheNodeType
      NumCacheClusters: 1
      AutomaticFailoverEnabled: false
      MultiAZEnabled: false
      CacheSubnetGroupName: !Ref CacheSubnetGroup
      SecurityGroupIds:
        - Fn::ImportValue: !Sub '${NetworkStackName}-DataSecurityGroupId'
      Port: 6379
      # The principal cache holds email addresses and role assignments, so encrypt the disk. In
      # transit is left off to match the task's REDIS_SSL_ENABLED, with the security group as the
      # boundary.
      #
      # Turning it on was attempted on 31 August 2026 and rolled back. Enabling transit encryption
      # changes the primary endpoint address, and CloudFormation will not change an exported value
      # while another stack imports it — digital-health-app imports CacheEndpoint and CachePort. The
      # cache modification itself succeeded in place and took sixteen minutes; the export conflict
      # then reversed it, for sixteen more. Production was unaffected.
      #
      # Doing it properly means breaking that export coupling first, so that the endpoint is free to
      # change. See docs/superpowers/plans/2026-08-31-hardening-2-operations.md, task 3.
      #
      # Before touching anything whose value is exported:
      #   aws cloudformation list-imports --export-name digital-health-data-CacheEndpoint
      AtRestEncryptionEnabled: true
      TransitEncryptionEnabled: false
      PreferredMaintenanceWindow: 'sun:18:30-sun:19:30'
      Tags:
        - Key: Application
          Value: digital-health-app
        - Key: Environment
          Value: !Ref EnvironmentName

Outputs:
  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address
    Export:
      Name: !Sub '${AWS::StackName}-DatabaseEndpoint'

  DatabasePort:
    Value: !GetAtt Database.Endpoint.Port
    Export:
      Name: !Sub '${AWS::StackName}-DatabasePort'

  DatabaseName:
    Value: !Ref DatabaseName
    Export:
      Name: !Sub '${AWS::StackName}-DatabaseName'

  DatabaseSecretArn:
    Description: >
      Secrets Manager secret holding {"username","password"}. Scripts may read this ARN; the app
      stack resolves the secret by name so this export can change without a coupled deploy.
    Value: !Ref DatabaseCredentialsSecret
    Export:
      Name: !Sub '${AWS::StackName}-DatabaseSecretArn'

  CacheEndpoint:
    Value: !GetAtt Cache.PrimaryEndPoint.Address
    Export:
      Name: !Sub '${AWS::StackName}-CacheEndpoint'

  CachePort:
    Value: !GetAtt Cache.PrimaryEndPoint.Port
    Export:
      Name: !Sub '${AWS::StackName}-CachePort'
