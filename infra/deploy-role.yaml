AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Role GitHub Actions assumes to deploy. Trust is established through OIDC and scoped to one
  repository, so there is no long-lived access key anywhere.

Parameters:
  GitHubOrg:
    Type: String
    Description: Owner of the repository, for example acme-health.

  GitHubRepository:
    Type: String
    Description: Repository name, without the owner.

  GitHubOwnerId:
    Type: String
    Description: >
      Numeric account id, from `gh api repos/OWNER/REPO --jq .owner.id`. GitHub issues immutable
      OIDC claims, so the subject carries owner@id and repo@id rather than names alone, and a
      condition matching on names never matches anything.

  GitHubRepositoryId:
    Type: String
    Description: Numeric repository id, from `gh api repos/OWNER/REPO --jq .id`.

  DeployEnvironment:
    Type: String
    Default: production
    Description: >
      Only a job declaring this GitHub environment may assume the role. A job that names an
      environment gets a subject of repo:owner/name:environment:<name> rather than one naming the
      branch, so trusting the branch form would refuse the very job meant to deploy. Which branches
      may reach the environment is a deployment branch policy configured on the environment itself.

  CreateOidcProvider:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >
      Set to false when another stack in this account already registered GitHub as an OIDC
      provider; an account may only have one per issuer.

Conditions:
  ShouldCreateProvider: !Equals [!Ref CreateOidcProvider, 'true']

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'digital-health-deploy-${GitHubRepository}'
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - ShouldCreateProvider
                - !Ref GitHubOidcProvider
                - !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # Pinned to the numeric ids rather than wildcarded past them. Binding trust to
                # something nobody can rename into is the whole point of the immutable claim.
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubOrg}@${GitHubOwnerId}/${GitHubRepository}@${GitHubRepositoryId}:environment:${DeployEnvironment}'
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # CloudFormation drives everything, so the role needs the permissions of the
              # resources it creates. Narrowing this further means enumerating every property
              # CloudFormation touches; the trust policy is the meaningful boundary.
              - Effect: Allow
                Action:
                  - cloudformation:*
                  - ec2:*
                  - ecs:*
                  - ecr:*
                  - elasticloadbalancing:*
                  - rds:*
                  - elasticache:*
                  - cognito-idp:*
                  - logs:*
                  - acm:*
                  - route53:*
                  - cloudfront:*
                  - secretsmanager:*
                  - s3:*
                  # Alarms and the topic they publish to. Added after a deploy failed on
                  # SNS:GetTopicAttributes: the change set had been previewed under an
                  # administrator's credentials, which say nothing about what this role may do.
                  - sns:*
                  - cloudwatch:*
                  # The configuration set and its event destination, and nothing else. Enumerated
                  # rather than ses:* because this role deploys mail infrastructure and has no
                  # business sending a message or altering a verified identity. The five
                  # PutConfigurationSet*Options calls are what the resource handler makes on every
                  # create regardless of which options the template actually sets.
                  - ses:GetIdentityVerificationAttributes
                  - ses:CreateConfigurationSet
                  - ses:DeleteConfigurationSet
                  - ses:GetConfigurationSet
                  - ses:PutConfigurationSetDeliveryOptions
                  - ses:PutConfigurationSetReputationOptions
                  - ses:PutConfigurationSetSendingOptions
                  - ses:PutConfigurationSetSuppressionOptions
                  - ses:PutConfigurationSetTrackingOptions
                  - ses:CreateConfigurationSetEventDestination
                  - ses:UpdateConfigurationSetEventDestination
                  - ses:DeleteConfigurationSetEventDestination
                  - ses:GetConfigurationSetEventDestinations
                Resource: '*'
              - Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:PassRole
                  - iam:TagRole
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:UpdateAssumeRolePolicy
                Resource:
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/digital-health-*'
              # Creating the RDS instance and the ECS service needs their service-linked roles the
              # first time, and CloudFormation makes them on the caller's behalf.
              - Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: '*'
                Condition:
                  StringEquals:
                    iam:AWSServiceName:
                      - ecs.amazonaws.com
                      - rds.amazonaws.com
                      - elasticache.amazonaws.com

Outputs:
  DeployRoleArn:
    Description: Value for the workflow's role-to-assume.
    Value: !GetAtt DeployRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-DeployRoleArn'
