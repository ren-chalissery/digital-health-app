name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and API drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Testcontainers starts Postgres and Valkey itself; the runner's Docker daemon is enough.
      - name: Test
        working-directory: backend
        run: ./gradlew test

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test

  ios:
    name: iOS build and tests
    # Deliberately not a dependency of `deploy`. The app ships through TestFlight, not through
    # this pipeline, so a broken iOS build must not stop the backend and web from deploying.
    #
    # macOS minutes are billed at ten times Linux, so this runs only when iOS or the API contract
    # it is generated from actually changed.
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: macos-26
    steps:
      # Full history: the default shallow clone has no base commit to diff against, so the change
      # detection below would fall through and run on every push.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check what changed
        id: changed
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$base" HEAD | grep -qE '^(ios/|api-contract/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      # Pinned rather than left on the image default. The default moves — it went from 26.5 to
      # 26.6 in July — and a runner image update should not silently change the compiler.
      - name: Select Xcode
        if: steps.changed.outputs.run == 'true'
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      # Not on the runner image, and pinned rather than installed from Homebrew. An unpinned
      # linter is a build that can fail without anybody changing code: Homebrew had 0.65.1 while
      # this repository lints with 0.63.2, and the newer one called a needed disable comment
      # superfluous. `ios/.swiftlint-version` is the single declaration of which version applies.
      - name: Install SwiftLint
        if: steps.changed.outputs.run == 'true'
        run: |
          version=$(cat ios/.swiftlint-version)
          curl -sSL -o /tmp/swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${version}/portable_swiftlint.zip"
          unzip -q -o /tmp/swiftlint.zip -d /tmp/swiftlint
          sudo install /tmp/swiftlint/swiftlint /usr/local/bin/swiftlint
          swiftlint version

      - name: Package tests and lint
        if: steps.changed.outputs.run == 'true'
        working-directory: ios
        run: ./test-all.sh

      # Resolved at runtime rather than hard-coded: the simulators on a runner image change
      # without notice, and a missing device name fails with a much less obvious error.
      - name: Choose a simulator
        if: steps.changed.outputs.run == 'true'
        id: simulator
        run: |
          name=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(v['name'] for r in d.values() for v in r if v['name'].startswith('iPhone')))")
          echo "Using $name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # -skipPackagePluginValidation is not optional: Amplify depends on smithy-swift, which ships
      # a build plugin that xcodebuild refuses to run unvalidated from the command line.
      - name: App build and UI smoke test
        if: steps.changed.outputs.run == 'true'
        working-directory: ios
        run: |
          xcodebuild test \
            -workspace Simplicity.xcworkspace \
            -scheme Simplicity_iOS \
            -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.name }}" \
            -skipPackagePluginValidation \
            -skipMacroValidation

  clients:
    name: Generated clients are current
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: api-contract/package-lock.json

      - name: Regenerate the Angular client
        working-directory: api-contract
        run: |
          npm ci
          npm run generate:web

      # The committed client has to match what the committed document produces. Without this, an
      # endpoint could be added to openapi.yaml and never reach the app.
      - name: Fail if the committed client differs
        run: |
          if ! git diff --quiet -- web/src/app/api; then
            echo "The generated Angular client is out of date. Run 'npm run generate:web' in api-contract and commit the result."
            git diff --stat -- web/src/app/api
            exit 1
          fi

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        run: npm run build

      - name: Test
        working-directory: web
        run: npm test

      - uses: actions/upload-artifact@v4
        with:
          name: web-bundle
          path: web/dist/web/browser
          retention-days: 1

  deploy:
    name: Deploy
    # arm64, to match the Graviton task definition and build the image without emulation. Standard
    # runner, same size and same free-minute allocation as the x86 one.
    runs-on: ubuntu-24.04-arm
    needs: [backend, clients, web]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      # Required for the OIDC token exchange. There are no long-lived AWS keys anywhere.
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      APP_STACK: digital-health-app
      WEB_STACK: digital-health-web
      AUTH_STACK: digital-health-auth
      MEDIA_STACK: digital-health-media
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      # The repository lives in the app stack, which must therefore already exist. Bootstrapping it
      # the first time is a manual step, described in infra/README.md.
      #
      # Only the commit sha is tagged. The repository is immutable, so a 'latest' tag could be
      # written exactly once and would fail every deploy after it.
      - name: Build and push the image
        working-directory: backend
        run: |
          repository="$(aws cloudformation describe-stacks --stack-name "$APP_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='RepositoryUri'].OutputValue" --output text)"
          docker build --platform linux/arm64 -t "$repository:${{ github.sha }}" .
          docker push "$repository:${{ github.sha }}"

      # Tagging the task definition with the commit rather than 'latest' is what makes a deploy
      # reproducible and a rollback a matter of redeploying an older sha.
      #
      # CertificateArn is deliberately absent. This stack issues and validates its own certificate
      # for the API, and passing that ARN back in would flip the condition guarding it, leaving
      # CloudFormation trying to delete a certificate its own listener still references. Parameters
      # not named here keep their existing values.
      - name: Deploy the app stack
        run: |
          aws cloudformation deploy \
            --template-file infra/app.yaml \
            --stack-name "$APP_STACK" \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              NetworkStackName=digital-health-network \
              DataStackName=digital-health-data \
              AuthStackName="$AUTH_STACK" \
              MediaStackName="$MEDIA_STACK" \
              ApiDomainName=${{ vars.API_DOMAIN_NAME }} \
              HostedZoneId=${{ vars.HOSTED_ZONE_ID }} \
              WebBaseUrl=${{ vars.WEB_BASE_URL }} \
              MailFrom=${{ vars.MAIL_FROM }} \
              ImageTag=${{ github.sha }}

      - name: Deploy the web stack
        run: |
          aws cloudformation deploy \
            --template-file infra/web.yaml \
            --stack-name "$WEB_STACK" \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              WebDomainName=${{ vars.WEB_DOMAIN_NAME }} \
              CertificateArn=${{ vars.WEB_CERTIFICATE_ARN }} \
              HostedZoneId=${{ vars.HOSTED_ZONE_ID }}

      - name: Wait for the service to reach a steady state
        run: |
          cluster="$(aws cloudformation describe-stacks --stack-name "$APP_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='ClusterName'].OutputValue" --output text)"
          service="$(aws cloudformation describe-stacks --stack-name "$APP_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='ServiceName'].OutputValue" --output text)"
          aws ecs wait services-stable --cluster "$cluster" --services "$service"

      - uses: actions/download-artifact@v4
        with:
          name: web-bundle
          path: web-bundle

      # Written here rather than baked into the bundle, so the same artefact could be promoted to
      # another environment by writing a different file.
      - name: Write config.json from the stack outputs
        run: |
          output() {
            aws cloudformation describe-stacks --stack-name "$1" \
              --query "Stacks[0].Outputs[?OutputKey=='$2'].OutputValue" --output text
          }
          jq -n \
            --arg apiBaseUrl "$(output "$APP_STACK" ApiBaseUrl)" \
            --arg userPoolId "$(output "$AUTH_STACK" UserPoolId)" \
            --arg userPoolClientId "$(output "$AUTH_STACK" WebClientId)" \
            '{apiBaseUrl: $apiBaseUrl, cognito: {userPoolId: $userPoolId, userPoolClientId: $userPoolClientId}}' \
            > web-bundle/config.json
          cat web-bundle/config.json

      - name: Sync to S3
        run: |
          bucket="$(aws cloudformation describe-stacks --stack-name "$WEB_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue" --output text)"
          # Fingerprinted assets first and cached hard; the two files that are not fingerprinted
          # must never be cached, or a deploy would leave browsers on the previous bundle.
          aws s3 sync web-bundle "s3://$bucket" --delete \
            --cache-control 'public,max-age=31536000,immutable' \
            --exclude index.html --exclude config.json
          aws s3 cp web-bundle/index.html "s3://$bucket/index.html" \
            --cache-control 'no-cache,no-store,must-revalidate'
          aws s3 cp web-bundle/config.json "s3://$bucket/config.json" \
            --cache-control 'no-cache,no-store,must-revalidate'

      - name: Invalidate CloudFront
        run: |
          distribution="$(aws cloudformation describe-stacks --stack-name "$WEB_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" --output text)"
          id="$(aws cloudfront create-invalidation --distribution-id "$distribution" \
            --paths '/index.html' '/config.json' --query 'Invalidation.Id' --output text)"
          aws cloudfront wait invalidation-completed \
            --distribution-id "$distribution" --id "$id"

      - name: Smoke check
        run: |
          api="$(aws cloudformation describe-stacks --stack-name "$APP_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiBaseUrl'].OutputValue" --output text)"
          web="$(aws cloudformation describe-stacks --stack-name "$WEB_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='WebBaseUrl'].OutputValue" --output text)"
          curl -fsS --retry 5 --retry-delay 10 --retry-all-errors "$api/actuator/health/readiness"
          curl -fsS --retry 5 --retry-delay 10 --retry-all-errors "$web/config.json" > /dev/null
          # A token this application never issued must be refused. Cheap, but it proves the
          # resource server is actually validating rather than waving requests through.
          status="$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer not-a-token' "$api/api/v1/me")"
          test "$status" = "401" || { echo "Expected 401 from /api/v1/me, got $status"; exit 1; }
