name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changed.outputs.backend }}
      web: ${{ steps.changed.outputs.web }}
      android: ${{ steps.changed.outputs.android }}
      ios: ${{ steps.changed.outputs.ios }}
      deploy: ${{ steps.changed.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Full history: the default shallow clone has no base commit to diff against, so every job
      # would run on every push.
      - name: Check what changed
        id: changed
        run: |
          backend=false
          web=false
          android=false
          ios=false
          deploy=false

          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            backend=true
            web=true
            android=true
            ios=true
            deploy=true
          else
            files="$(git diff --name-only "$base" HEAD)"
            echo "$files"
            if echo "$files" | grep -qE '^(backend/|api-contract/)'; then backend=true; fi
            if echo "$files" | grep -qE '^web/'; then web=true; fi
            if echo "$files" | grep -qE '^(android/|api-contract/)'; then android=true; fi
            if echo "$files" | grep -qE '^(ios/|api-contract/)'; then ios=true; fi
            if echo "$files" | grep -qE '^(backend/|web/|infra/app\.yaml|infra/web\.yaml|infra/box/|\.github/workflows/ci\.yml)'; then
              deploy=true
            fi
          fi

          {
            echo "backend=$backend"
            echo "web=$web"
            echo "android=$android"
            echo "ios=$ios"
            echo "deploy=$deploy"
          } >> "$GITHUB_OUTPUT"

  backend:
    name: Backend tests and API drift check
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      # Testcontainers starts Postgres and Valkey itself; the runner's Docker daemon is enough.
      - name: Test
        working-directory: backend
        run: ./gradlew test

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test

  ios:
    name: iOS build and tests
    # Deliberately not a dependency of `deploy`. The app ships through TestFlight, not through
    # this pipeline, so a broken iOS build must not stop the backend and web from deploying.
    #
    # macOS minutes are billed at ten times Linux, so this runs only when iOS or the API contract
    # it is generated from actually changed.
    needs: changes
    if: |
      needs.changes.outputs.ios == 'true' &&
      (github.event_name == 'push' || github.event.pull_request.draft == false)
    runs-on: macos-26
    steps:
      # Pinned rather than left on the image default. The default moves — it went from 26.5 to
      # 26.6 in July — and a runner image update should not silently change the compiler.
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      # Not on the runner image, and pinned rather than installed from Homebrew. An unpinned
      # linter is a build that can fail without anybody changing code: Homebrew had 0.65.1 while
      # this repository lints with 0.63.2, and the newer one called a needed disable comment
      # superfluous. `ios/.swiftlint-version` is the single declaration of which version applies.
      - name: Install SwiftLint
        run: |
          version=$(cat ios/.swiftlint-version)
          curl -sSL -o /tmp/swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${version}/portable_swiftlint.zip"
          unzip -q -o /tmp/swiftlint.zip -d /tmp/swiftlint
          sudo install /tmp/swiftlint/swiftlint /usr/local/bin/swiftlint
          swiftlint version

      - name: Package tests and lint
        working-directory: ios
        run: ./test-all.sh

      # Resolved at runtime rather than hard-coded: the simulators on a runner image change
      # without notice, and a missing device name fails with a much less obvious error.
      - name: Choose a simulator
        id: simulator
        run: |
          name=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(v['name'] for r in d.values() for v in r if v['name'].startswith('iPhone')))")
          echo "Using $name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # -skipPackagePluginValidation is not optional: Amplify depends on smithy-swift, which ships
      # a build plugin that xcodebuild refuses to run unvalidated from the command line.
      - name: App build and UI smoke test
        working-directory: ios
        run: |
          xcodebuild test \
            -workspace Simplicity.xcworkspace \
            -scheme Simplicity_iOS \
            -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.name }}" \
            -skipPackagePluginValidation \
            -skipMacroValidation

  clients:
    name: Generated clients are current
    runs-on: ubuntu-latest
    needs: [changes, backend]
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: api-contract/package-lock.json

      # All three, not just Angular. Each client is committed, so each can silently fall behind
      # openapi.yaml — and until Android arrived only the web one was ever checked, which meant an
      # endpoint could reach the API and the web app while leaving iOS and Android stale with
      # nothing failing.
      - name: Regenerate every client
        working-directory: api-contract
        run: |
          npm ci
          npm run generate:web
          npm run generate:ios
          npm run generate:android

      - name: Fail if any committed client differs
        run: |
          stale=0
          check() {
            if ! git diff --quiet -- "$2"; then
              echo "::error::The generated $1 client is out of date. Run 'npm run generate:$3' in api-contract and commit the result."
              git diff --stat -- "$2"
              stale=1
            fi
          }
          check Angular web/src/app/api web
          check Swift ios/Packages/SimplicityApi/Sources/SimplicityApi/Generated ios
          check Kotlin android/api-client android
          exit "$stale"

  web:
    name: Web build
    needs: changes
    # Deploy always uploads the web bundle, so build it even when only the backend changed.
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        run: npm run build

      - name: Test
        working-directory: web
        run: npm test

      - uses: actions/upload-artifact@v7
        with:
          name: web-bundle
          path: web/dist/web/browser
          retention-days: 1

  # ubuntu-latest, not macos. The iOS job pays ten times the rate on macos-26 and takes twenty
  # minutes, which is why it is path-filtered; this one is standard rate and can run on every push.
  android:
    name: Android build and tests
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6

      - name: Test
        working-directory: android
        run: ./gradlew test

      - name: Assemble
        working-directory: android
        run: ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-test-report
          path: android/**/build/reports/tests
          retention-days: 3

  # Advisory, not blocking, and deliberately so.
  #
  # A transitive vulnerability with no published fix would otherwise block every unrelated pull
  # request, and a check people learn to force past is worse than no check at all. Dependabot is
  # what actually drives upgrades; this job is for seeing what is outstanding without having to ask.
  #
  # Worth revisiting once the noise level is known — that is a judgement this repository has no
  # data for yet.
  audit:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Audit web dependencies
        working-directory: web
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Summarise
        if: always()
        working-directory: web
        run: |
          {
            echo '## Dependency audit'
            echo
            echo 'Advisory only. Dependabot opens the pull requests that fix these.'
            echo
            echo '```'
            npm audit --audit-level=high 2>&1 | tail -30 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy
    # arm64, to match the Graviton task definition and build the image without emulation. Standard
    # runner, same size and same free-minute allocation as the x86 one.
    runs-on: ubuntu-24.04-arm
    needs: [changes, backend, clients, web]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.changes.outputs.deploy == 'true' &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped') &&
      (needs.clients.result == 'success' || needs.clients.result == 'skipped') &&
      needs.web.result == 'success'
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      # Required for the OIDC token exchange. There are no long-lived AWS keys anywhere.
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      APP_STACK: digital-health-app
      WEB_STACK: digital-health-web
      AUTH_STACK: digital-health-auth
      MEDIA_STACK: digital-health-media
      MAIL_STACK: digital-health-mail
      BOX_STACK: digital-health-box
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      # The mail stack is shared by both topologies and is never deleted on pause.
      - name: Deploy the mail stack
        run: |
          aws cloudformation deploy \
            --template-file infra/mail.yaml \
            --stack-name "$MAIL_STACK" \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              EnvironmentName=prod \
              AlarmEmail=${{ secrets.ALARM_EMAIL }}

      # There are two topologies and only one of them is ever deployed: the load balancer and
      # Fargate service, or the single instance that replaces them. Both cannot own the API's DNS
      # record at once, so the live one is whichever stack exists, and every step below follows
      # from that rather than from a setting somebody has to remember to change.
      #
      # Each topology owns its own registry, because the app stack's repository is deleted along
      # with the app stack.
      - name: Resolve the live topology
        id: topology
        run: |
          if aws cloudformation describe-stacks --stack-name "$BOX_STACK" >/dev/null 2>&1; then
            name=box
            stack="$BOX_STACK"
            api="$(aws cloudformation describe-stacks --stack-name "$BOX_STACK" \
              --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" --output text)"
          else
            name=ecs
            stack="$APP_STACK"
            api="$(aws cloudformation describe-stacks --stack-name "$APP_STACK" \
              --query "Stacks[0].Outputs[?OutputKey=='ApiBaseUrl'].OutputValue" --output text)"
          fi
          repository="$(aws cloudformation describe-stacks --stack-name "$stack" \
            --query "Stacks[0].Outputs[?OutputKey=='RepositoryUri'].OutputValue" --output text)"
          {
            echo "name=$name"
            echo "repository=$repository"
            echo "api=$api"
          } >> "$GITHUB_OUTPUT"
          echo "Deploying the $name topology to $api"

      # Only the commit sha is tagged. The repository is immutable, so a 'latest' tag could be
      # written exactly once and would fail every deploy after it. box/bootstrap.sh may have
      # pushed the same sha already, which is normal when somebody applies a stack change by hand
      # before the merge commit's pipeline runs.
      - name: Build and push the image
        working-directory: backend
        run: |
          repository="${{ steps.topology.outputs.repository }}"
          tag="${{ github.sha }}"
          repo_name="${repository##*/}"
          if aws ecr describe-images --repository-name "$repo_name" \
              --image-ids "imageTag=$tag" >/dev/null 2>&1; then
            echo "Image ${tag} is already in ${repo_name}. Skipping build and push."
          else
            docker build --platform linux/arm64 -t "$repository:$tag" .
            docker push "$repository:$tag"
          fi

      # Tagging the task definition with the commit rather than 'latest' is what makes a deploy
      # reproducible and a rollback a matter of redeploying an older sha.
      #
      # CertificateArn is deliberately absent. This stack issues and validates its own certificate
      # for the API, and passing that ARN back in would flip the condition guarding it, leaving
      # CloudFormation trying to delete a certificate its own listener still references. Parameters
      # not named here keep their existing values.
      #
      # MailConfigurationSet and AlarmTopicArn come from the mail stack, which survives pausing
      # this one. Do not put a comment between the continued lines below. A '#' after a trailing
      # backslash ends the command at that point, and the shell reads the remaining assignments as
      # a separate no-op statement. Doing exactly that silently dropped ImageTag, so a deploy
      # reported success while shipping no new image at all.
      - name: Deploy the app stack
        if: steps.topology.outputs.name == 'ecs'
        run: |
          mailConfigurationSet="$(aws cloudformation describe-stacks --stack-name "$MAIL_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='MailConfigurationSetName'].OutputValue" --output text)"
          alarmTopicArn="$(aws cloudformation describe-stacks --stack-name "$MAIL_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='AlarmTopicArn'].OutputValue" --output text)"
          aws cloudformation deploy \
            --template-file infra/app.yaml \
            --stack-name "$APP_STACK" \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              NetworkStackName=digital-health-network \
              DataStackName=digital-health-data \
              AuthStackName="$AUTH_STACK" \
              MediaStackName="$MEDIA_STACK" \
              ApiDomainName=${{ vars.API_DOMAIN_NAME }} \
              HostedZoneId=${{ vars.HOSTED_ZONE_ID }} \
              WebBaseUrl=${{ vars.WEB_BASE_URL }} \
              MailFrom=${{ vars.MAIL_FROM }} \
              MailConfigurationSet="${mailConfigurationSet}" \
              AlarmTopicArn="${alarmTopicArn}" \
              ImageTag=${{ github.sha }}

      - name: Deploy the web stack
        run: |
          aws cloudformation deploy \
            --template-file infra/web.yaml \
            --stack-name "$WEB_STACK" \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              WebDomainName=${{ vars.WEB_DOMAIN_NAME }} \
              CertificateArn=${{ vars.WEB_CERTIFICATE_ARN }} \
              HostedZoneId=${{ vars.HOSTED_ZONE_ID }}

      - name: Wait for the service to reach a steady state
        if: steps.topology.outputs.name == 'ecs'
        run: |
          cluster="$(aws cloudformation describe-stacks --stack-name "$APP_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='ClusterName'].OutputValue" --output text)"
          service="$(aws cloudformation describe-stacks --stack-name "$APP_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='ServiceName'].OutputValue" --output text)"
          aws ecs wait services-stable --cluster "$cluster" --services "$service"

      # The equivalent for the single instance. The compose file and helper scripts are synced
      # first, so a change to either ships with the commit that made it rather than waiting for
      # somebody to run box/bootstrap.sh.
      #
      # The tag is written to Parameter Store whether or not the instance is running. That is the
      # whole reason a stopped box is not a failed deploy: this topology exists to be switched off
      # between demonstrations, and deploy.sh reads the pending tag on next boot.
      #
      # Note what this deliberately does not do: deploy box/box.yaml. Editing that template's UserData
      # replaces the instance, and the database lives on its root volume, so an automatic stack
      # update would quietly destroy the data on an unrelated merge. Template changes go through
      # box/bootstrap.sh, where somebody is watching.
      - name: Deploy to the box
        id: box
        if: steps.topology.outputs.name == 'box'
        run: |
          instance="$(aws cloudformation describe-stacks --stack-name "$BOX_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='InstanceId'].OutputValue" --output text)"
          bucket="$(aws cloudformation describe-stacks --stack-name "$BOX_STACK" \
            --query "Stacks[0].Parameters[?ParameterKey=='ConfigBucket'].ParameterValue" --output text)"

          aws s3 sync infra/box/ "s3://$bucket/box/" --delete --only-show-errors \
            --exclude 'box.yaml' --exclude 'bootstrap.sh' --exclude 'teardown.sh'
          aws ssm put-parameter --name "/digital-health/prod/box/image-tag" \
            --value "${{ github.sha }}" --type String --overwrite >/dev/null

          state="$(aws ec2 describe-instances --instance-ids "$instance" \
            --query 'Reservations[0].Instances[0].State.Name' --output text)"
          echo "running=$([ "$state" = running ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          if [ "$state" != "running" ]; then
            echo "::notice::Instance is $state. Tag recorded; it will be applied on next boot."
            exit 0
          fi

          id="$(aws ssm send-command --instance-ids "$instance" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${{ github.sha }}" \
            --parameters 'commands=["aws s3 cp --recursive s3://'"$bucket"'/box/ /opt/box/","chmod +x /opt/box/*.sh","/opt/box/deploy.sh ${{ github.sha }}"]' \
            --timeout-seconds 600 \
            --query 'Command.CommandId' --output text)"

          # Polled rather than waited on, because `ssm wait command-executed` reports a failure
          # without ever printing the output that explains it.
          for _ in $(seq 1 90); do
            status="$(aws ssm get-command-invocation --command-id "$id" \
              --instance-id "$instance" --query Status --output text 2>/dev/null || echo Pending)"
            case "$status" in
              Success) break ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation --command-id "$id" --instance-id "$instance" \
                  --query StandardErrorContent --output text
                echo "Deploy failed on the instance."
                exit 1
                ;;
            esac
            sleep 10
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id "$instance" \
            --query StandardOutputContent --output text | tail -5
          test "$status" = "Success"

      - uses: actions/download-artifact@v8
        with:
          name: web-bundle
          path: web-bundle

      # Written here rather than baked into the bundle, so the same artefact could be promoted to
      # another environment by writing a different file.
      - name: Write config.json from the stack outputs
        run: |
          output() {
            aws cloudformation describe-stacks --stack-name "$1" \
              --query "Stacks[0].Outputs[?OutputKey=='$2'].OutputValue" --output text
          }
          jq -n \
            --arg apiBaseUrl "${{ steps.topology.outputs.api }}" \
            --arg userPoolId "$(output "$AUTH_STACK" UserPoolId)" \
            --arg userPoolClientId "$(output "$AUTH_STACK" WebClientId)" \
            '{apiBaseUrl: $apiBaseUrl, cognito: {userPoolId: $userPoolId, userPoolClientId: $userPoolClientId}}' \
            > web-bundle/config.json
          cat web-bundle/config.json

      - name: Sync to S3
        run: |
          bucket="$(aws cloudformation describe-stacks --stack-name "$WEB_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue" --output text)"
          # Fingerprinted assets first and cached hard; the two files that are not fingerprinted
          # must never be cached, or a deploy would leave browsers on the previous bundle.
          aws s3 sync web-bundle "s3://$bucket" --delete \
            --cache-control 'public,max-age=31536000,immutable' \
            --exclude index.html --exclude config.json
          aws s3 cp web-bundle/index.html "s3://$bucket/index.html" \
            --cache-control 'no-cache,no-store,must-revalidate'
          aws s3 cp web-bundle/config.json "s3://$bucket/config.json" \
            --cache-control 'no-cache,no-store,must-revalidate'

      - name: Invalidate CloudFront
        run: |
          distribution="$(aws cloudformation describe-stacks --stack-name "$WEB_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" --output text)"
          id="$(aws cloudfront create-invalidation --distribution-id "$distribution" \
            --paths '/index.html' '/config.json' --query 'Invalidation.Id' --output text)"
          aws cloudfront wait invalidation-completed \
            --distribution-id "$distribution" --id "$id"

      - name: Smoke check
        run: |
          api="${{ steps.topology.outputs.api }}"
          web="$(aws cloudformation describe-stacks --stack-name "$WEB_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='WebBaseUrl'].OutputValue" --output text)"

          curl -fsS --retry 5 --retry-delay 10 --retry-all-errors "$web/config.json" > /dev/null

          # A stopped box is a deliberate state, not a broken deploy, so the API checks are skipped
          # rather than failed. The web bundle above is still verified: it is served by CloudFront
          # and does not care whether the API is up.
          if [ "${{ steps.topology.outputs.name }}" = box ] \
            && [ "${{ steps.box.outputs.running }}" != true ]; then
            echo "::notice::The box is stopped, so the API was not checked."
            exit 0
          fi

          curl -fsS --retry 5 --retry-delay 10 --retry-all-errors "$api/actuator/health/readiness"
          # A token this application never issued must be refused. Cheap, but it proves the
          # resource server is actually validating rather than waving requests through.
          status="$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer not-a-token' "$api/api/v1/me")"
          test "$status" = "401" || { echo "Expected 401 from /api/v1/me, got $status"; exit 1; }
