openapi: 3.1.0
info:
  description: Backend for the Simplicity digital training package. Every endpoint
    except the invitation preview requires a Cognito access token.
  title: Simplicity training API
  version: "1"
servers:
- url: /
security:
- bearerAuth: []
tags:
- description: Video for training modules
  name: Media
- description: The signed-in clinician's own profile and memberships
  name: Current user
- description: Questions answered from the training material
  name: Assistant
- description: The signed-in clinician's private journal
  name: Reflections
- description: Authoring training modules
  name: Modules
- description: Modules assigned to the signed-in clinician
  name: Learning
paths:
  /api/v1/invitations/{token}:
    get:
      description: "Public. Returns valid=false for anything unknown, expired, or\
        \ already used, so the endpoint cannot be used to probe for live tokens."
      operationId: previewInvitation
      parameters:
      - in: path
        name: token
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationPreviewResponse"
          description: OK
      summary: Preview an invitation before signing up
      tags:
      - Invitations
  /api/v1/invitations/{token}/accept:
    post:
      operationId: acceptInvitation
      parameters:
      - in: path
        name: token
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
      summary: Accept an invitation as the signed-in user
      tags:
      - Invitations
  /api/v1/me:
    get:
      description: Provisions the user on first call. Clients use profileCompleted
        and the organisations list to decide whether to show onboarding.
      operationId: getCurrentUser
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
          description: OK
      summary: Describe the signed-in user
      tags:
      - Current user
  /api/v1/me/active-organisation:
    put:
      description: Stored on the user so the choice follows them to another device.
        Refused for any organisation that is not a live membership of the caller's.
      operationId: setActiveOrganisation
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetActiveOrganisationRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
          description: OK
      summary: Choose which organisation to work in
      tags:
      - Current user
  /api/v1/me/profile:
    put:
      description: "Sets profileCompleted, which is what lets the client leave the\
        \ wizard."
      operationId: updateProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
          description: OK
      summary: Complete or update the professional profile
      tags:
      - Current user
  /api/v1/me/reflections:
    get:
      operationId: listReflections
      parameters:
      - in: query
        name: q
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReflectionResponse"
          description: OK
      summary: "The caller's reflections, newest first, or those matching a search"
      tags:
      - Reflections
    post:
      operationId: writeReflection
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WriteReflectionRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReflectionResponse"
          description: Created
      summary: Write a reflection
      tags:
      - Reflections
  /api/v1/me/reflections/{reflectionId}:
    delete:
      operationId: deleteReflection
      parameters:
      - in: path
        name: reflectionId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
      summary: Delete one
      tags:
      - Reflections
    get:
      description: "Somebody else's returns 404, because a 403 would confirm that\
        \ it exists."
      operationId: getReflection
      parameters:
      - in: path
        name: reflectionId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReflectionResponse"
          description: OK
      summary: Read one
      tags:
      - Reflections
    put:
      operationId: editReflection
      parameters:
      - in: path
        name: reflectionId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WriteReflectionRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReflectionResponse"
          description: OK
      summary: Edit one
      tags:
      - Reflections
  /api/v1/organisations:
    post:
      description: The caller becomes its first administrator. Used by the self-signup
        flow.
      operationId: createOrganisation
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganisationRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganisationResponse"
          description: Created
      summary: Create an organisation
      tags:
      - Organisations
  /api/v1/orgs/{orgId}:
    delete:
      description: "Makes it unreachable for every member while keeping its memberships,\
        \ teams, and audit history. Nothing is deleted."
      operationId: archiveOrganisation
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
      summary: Archive an organisation
      tags:
      - Organisations
    get:
      operationId: getOrganisation
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganisationResponse"
          description: OK
      summary: Fetch one organisation
      tags:
      - Organisations
  /api/v1/orgs/{orgId}/assistant/questions:
    post:
      description: "Answers only from published modules in this organisation, with\
        \ citations. When the material does not cover the question it says so rather\
        \ than guessing, and no model is called. It never reads reflections and never\
        \ gives clinical advice."
      operationId: askAssistant
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnswerResponse"
          description: OK
      summary: Ask a question about the training
      tags:
      - Assistant
  /api/v1/orgs/{orgId}/invitations:
    get:
      operationId: listInvitations
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InvitationResponse"
          description: OK
      summary: List an organisation's invitations
      tags:
      - Invitations
    post:
      description: "Re-inviting an address withdraws the outstanding invitation and\
        \ issues a fresh link, so only one token is ever live for a given address."
      operationId: createInvitation
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationResponse"
          description: Created
      summary: Invite somebody to the organisation
      tags:
      - Invitations
  /api/v1/orgs/{orgId}/invitations/{invitationId}:
    delete:
      operationId: revokeInvitation
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: invitationId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
      summary: Withdraw an outstanding invitation
      tags:
      - Invitations
  /api/v1/orgs/{orgId}/learning:
    get:
      operationId: listAssignedModules
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssignedModuleResponse"
          description: OK
      summary: "Modules assigned to the caller's teams, with their progress"
      tags:
      - Learning
  /api/v1/orgs/{orgId}/learning/media/{assetId}/playback:
    get:
      description: Minted per request after the same assignment check that guards
        the module. Holding an asset id is not authorisation.
      operationId: getPlaybackUrl
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: assetId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackResponse"
          description: OK
      summary: A short-lived URL for a video in an assigned module
      tags:
      - Learning
  /api/v1/orgs/{orgId}/learning/sections/{sectionId}/complete:
    put:
      description: Completing the last section completes the module in the same transaction.
      operationId: completeSection
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: sectionId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearnerModuleResponse"
          description: OK
      summary: Mark a section as read
      tags:
      - Learning
  /api/v1/orgs/{orgId}/learning/{moduleId}:
    get:
      operationId: readModule
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: moduleId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearnerModuleResponse"
          description: OK
      summary: The published version of one assigned module
      tags:
      - Learning
  /api/v1/orgs/{orgId}/learning/{moduleId}/quiz:
    get:
      description: Questions and options only. Which option is correct is never sent
        here.
      operationId: getQuiz
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: moduleId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizResponse"
          description: OK
      summary: The quiz for an assigned module
      tags:
      - Learning
  /api/v1/orgs/{orgId}/learning/{moduleId}/quiz/attempts:
    post:
      description: "Marked on the server. Returns which questions were right, the\
        \ correct answer, and the author's explanation. Passing completes the module\
        \ if every section is read."
      operationId: submitQuizAttempt
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: moduleId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitAttemptRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttemptResultResponse"
          description: OK
      summary: Answer the quiz
      tags:
      - Learning
  /api/v1/orgs/{orgId}/media:
    get:
      operationId: listMedia
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MediaAssetResponse"
          description: OK
      summary: The organisation's video library
      tags:
      - Media
    post:
      description: Returns a presigned URL the browser PUTs to directly. Video never
        passes through the API on the way in.
      operationId: registerUpload
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterUploadRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadTargetResponse"
          description: Created
      summary: Register a video and get somewhere to put it
      tags:
      - Media
  /api/v1/orgs/{orgId}/media/{assetId}:
    delete:
      description: Any section using it keeps its writing and loses the video.
      operationId: deleteMedia
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: assetId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
      summary: Delete a video
      tags:
      - Media
  /api/v1/orgs/{orgId}/media/{assetId}/captions:
    delete:
      operationId: removeCaptions
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: assetId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaAssetResponse"
          description: OK
      summary: Remove the caption track
      tags:
      - Media
    put:
      description: "Sent as the request body rather than presigned, because a caption\
        \ file is kilobytes where a video is hundreds of megabytes."
      operationId: setCaptions
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: assetId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          text/vtt:
            schema:
              type: string
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaAssetResponse"
          description: OK
      summary: Attach a WebVTT caption track
      tags:
      - Media
  /api/v1/orgs/{orgId}/media/{assetId}/uploaded:
    post:
      description: Hands the file to the transcoder; the asset becomes PROCESSING.
      operationId: completeUpload
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: assetId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaAssetResponse"
          description: OK
      summary: Report that the upload finished
      tags:
      - Media
  /api/v1/orgs/{orgId}/members:
    get:
      operationId: listOrganisationMembers
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrgMemberResponse"
          description: OK
      summary: List everybody in an organisation
      tags:
      - Organisations
  /api/v1/orgs/{orgId}/members/me:
    delete:
      description: "Ends the caller's own membership and their teams within it. The\
        \ last administrator may leave, which archives the organisation rather than\
        \ leaving nobody able to administer it."
      operationId: leaveOrganisation
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
      summary: Leave an organisation
      tags:
      - Organisations
  /api/v1/orgs/{orgId}/members/{userId}:
    delete:
      operationId: removeOrganisationMember
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: userId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
      summary: "Remove a member, ending their team memberships in this organisation"
      tags:
      - Organisations
    patch:
      operationId: changeOrganisationRole
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: userId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeOrgRoleRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgMemberResponse"
          description: OK
      summary: Change a member's organisation role
      tags:
      - Organisations
  /api/v1/orgs/{orgId}/modules:
    get:
      operationId: listModules
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModuleSummaryResponse"
          description: OK
      summary: List this organisation's modules
      tags:
      - Modules
    post:
      description: "Comes with an empty first draft, since a module with no version\
        \ cannot be edited."
      operationId: createModule
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateModuleRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthoredModuleResponse"
          description: Created
      summary: Create a module
      tags:
      - Modules
  /api/v1/orgs/{orgId}/modules/{moduleId}:
    delete:
      description: Hidden from learners and authors alike. Completions and history
        are kept.
      operationId: archiveModule
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: moduleId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
      summary: Archive a module
      tags:
      - Modules
    get:
      operationId: getModule
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: moduleId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthoredModuleResponse"
          description: OK
      summary: "One module, with both the published version and the draft"
      tags:
      - Modules
    patch:
      operationId: updateModule
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: moduleId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateModuleRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthoredModuleResponse"
          description: OK
      summary: Rename a module or change its summary
      tags:
      - Modules
  /api/v1/orgs/{orgId}/modules/{moduleId}/draft:
    post:
      description: "Copies what learners currently have, so an edit starts from the\
        \ live content."
      operationId: openModuleDraft
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: moduleId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthoredModuleResponse"
          description: OK
      summary: Open a draft
      tags:
      - Modules
  /api/v1/orgs/{orgId}/modules/{moduleId}/draft/publish:
    post:
      description: "Set supersedesCompletions when the change is substantive, which\
        \ sends anyone who completed an earlier version back through it. A corrected\
        \ typo should not."
      operationId: publishModule
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: moduleId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthoredModuleResponse"
          description: OK
      summary: Publish the draft
      tags:
      - Modules
  /api/v1/orgs/{orgId}/modules/{moduleId}/draft/quiz:
    put:
      description: "Each question needs at least two options and exactly one correct\
        \ one; publishing refuses anything else, since a question with no answer can\
        \ never be passed."
      operationId: replaceModuleQuiz
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: moduleId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceQuizRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthoredModuleResponse"
          description: OK
      summary: Replace the draft's quiz questions
      tags:
      - Modules
  /api/v1/orgs/{orgId}/modules/{moduleId}/draft/sections:
    put:
      description: "Sent whole: editing, reordering, and deleting all happen on one\
        \ screen."
      operationId: replaceModuleSections
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: moduleId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceSectionsRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthoredModuleResponse"
          description: OK
      summary: Replace the draft's sections
      tags:
      - Modules
  /api/v1/orgs/{orgId}/modules/{moduleId}/teams:
    put:
      operationId: assignModuleToTeams
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: moduleId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignTeamsRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthoredModuleResponse"
          description: OK
      summary: Set which teams this module is assigned to
      tags:
      - Modules
  /api/v1/orgs/{orgId}/teams:
    get:
      operationId: listTeams
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamResponse"
          description: OK
      summary: List the teams in an organisation
      tags:
      - Teams
    post:
      description: Restricted to organisation administrators; team administrators
        cannot.
      operationId: createTeam
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeamRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamResponse"
          description: Created
      summary: Create a team
      tags:
      - Teams
  /api/v1/orgs/{orgId}/teams/{teamId}:
    delete:
      description: Organisation administrators only. A team administrator can manage
        their team's membership but cannot remove the team itself.
      operationId: deleteTeam
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: teamId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
      summary: Delete a team
      tags:
      - Teams
    get:
      operationId: getTeam
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: teamId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamResponse"
          description: OK
      summary: Fetch one team
      tags:
      - Teams
    patch:
      operationId: updateTeam
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: teamId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTeamRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamResponse"
          description: OK
      summary: Rename or redescribe a team
      tags:
      - Teams
  /api/v1/orgs/{orgId}/teams/{teamId}/members:
    get:
      operationId: listTeamMembers
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: teamId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamMemberDetailResponse"
          description: OK
      summary: List the people in a team
      tags:
      - Teams
    post:
      operationId: addTeamMember
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: teamId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddTeamMemberRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMemberDetailResponse"
          description: Created
      summary: Add an organisation member to a team
      tags:
      - Teams
  /api/v1/orgs/{orgId}/teams/{teamId}/members/{userId}:
    delete:
      operationId: removeTeamMember
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: teamId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: userId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
      summary: Remove somebody from a team
      tags:
      - Teams
components:
  schemas:
    AddTeamMemberRequest:
      type: object
      properties:
        teamRole:
          type: string
