services:
  postgres:
    image: postgres:16-alpine
    container_name: dha-postgres
    environment:
      POSTGRES_DB: digital_health
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d digital_health"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    # Valkey rather than Redis, matching ElastiCache in the deployed environment.
    image: valkey/valkey:8-alpine
    container_name: dha-valkey
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
